<style>
:root{--ink:#1E1B18;--bone:#FBFAF7;--bone-2:#F5F2EA;--terra:#A85D3B;--text-2:#6b665f;--border:#E7E2D8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bone-2);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px;}
.logo{display:block;width:64px;margin:0 auto 8px;}
.vora-wordmark{text-align:center;font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--ink);margin-bottom:2px;}
.tagline{text-align:center;font-size:12.5px;color:var(--text-2);margin-bottom:28px;letter-spacing:.02em;}
.titulo{font-size:19px;font-weight:700;margin-bottom:4px;text-align:center;}
.subtitulo{font-size:13px;color:var(--text-2);text-align:center;margin-bottom:26px;}
.cat-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--terra);margin:26px 0 10px;padding-left:2px;}
.cat-head:first-of-type{margin-top:0;}
.plan-card{background:var(--bone);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;}
.plan-nombre{font-size:15px;font-weight:700;color:var(--ink);}
.plan-meta{font-size:12.5px;color:var(--text-2);margin-top:3px;}
.plan-precio{font-size:14px;font-weight:700;color:var(--terra);margin-top:6px;}
.plan-notas{font-size:12.5px;color:var(--text-2);margin-top:8px;white-space:pre-wrap;line-height:1.45;}
.estado{text-align:center;padding:60px 20px;color:var(--text-2);font-size:13.5px;}
.footer-nota{text-align:center;font-size:11px;color:var(--text-2);margin-top:34px;opacity:.7;}
</style>

  <div class="tagline">Tu recuperación, en movimiento</div>
  <div class="titulo">Planes disponibles</div>
  <div class="subtitulo">Elegí el que mejor se ajuste a lo que necesitás y consultanos por WhatsApp.</div>
  <div id="contenido"><div class="estado">Cargando planes…</div></div>
  <div class="footer-nota">Los precios y condiciones pueden actualizarse. Ante cualquier duda, consultanos directamente.</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-H1Q7ganQheCNS5E-GfW9D0V04s-mneA",
  authDomain: "consultorio-fc375.firebaseapp.com",
  databaseURL: "https://consultorio-fc375-default-rtdb.firebaseio.com",
  projectId: "consultorio-fc375",
  storageBucket: "consultorio-fc375.firebasestorage.app",
  messagingSenderId: "479178186370",
  appId: "1:479178186370:web:e30e7089b64cd966239e9b"
};
firebase.initializeApp(firebaseConfig);
const planesRef = firebase.database().ref('consultorio/planesServicio');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

planesRef.once('value').then(snap=>{
  const planes = snap.val() || [];
  const lista = Array.isArray(planes) ? planes.filter(Boolean) : Object.values(planes);
  const cont = document.getElementById('contenido');
  if(!lista.length){
    cont.innerHTML = '<div class="estado">Todavía no hay planes cargados. Escribinos y te contamos las opciones disponibles.</div>';
    return;
  }
  const grupos = new Map();
  lista.forEach(pl=>{
    const cat = pl.categoria || 'General';
    if(!grupos.has(cat)) grupos.set(cat, []);
    grupos.get(cat).push(pl);
  });
  cont.innerHTML = [...grupos.entries()].map(([cat, items])=>`
    <div class="cat-head">${esc(cat)}</div>
    ${items.map(pl=>`
      <div class="plan-card">
        <div class="plan-nombre">${esc(pl.nombre)}</div>
        ${pl.sesiones?`<div class="plan-meta">${esc(pl.sesiones)}</div>`:''}
        ${pl.precio?`<div class="plan-precio">${esc(pl.precio)}</div>`:''}
        ${pl.notas?`<div class="plan-notas">${esc(pl.notas)}</div>`:''}
      </div>`).join('')}
  `).join('');
}).catch(()=>{
  document.getElementById('contenido').innerHTML = '<div class="estado">No pudimos cargar los planes en este momento. Probá de nuevo en un rato.</div>';
});
</script>
