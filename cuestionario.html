<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<style>
  :root{
    --accent:#6B8E5C;
    --accent-dark:#557548;
    --bg:#F5F6F5;
    --card:#FFFFFF;
    --border:#E2E5E2;
    --text-1:#1B2A22;
    --text-2:#5A6358;
    --text-3:#8A9188;
    --radius:14px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text-1);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .header svg{flex-shrink:0;}
  .header h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em;}
  .header p{font-size:12px;color:var(--text-3);margin:1px 0 0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;}
  .card-title{font-size:17px;font-weight:700;margin:0 0 2px;}
  .card-sub{font-size:12.5px;color:var(--text-2);margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:#fff;color:var(--text-1);}
  .sub-header{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-dark);margin:20px 0 8px;padding-top:10px;border-top:1px solid var(--border);}
  .sub-header:first-of-type{margin-top:6px;padding-top:0;border-top:none;}
  .item{margin-bottom:16px;}
  .item label{display:block;font-size:14.5px;font-weight:500;margin-bottom:7px;line-height:1.35;}
  .item select{
    width:100%;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;background:#fff;color:var(--text-1);appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M2 4l5 5 5-5' stroke='%235A6358' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;
  }
  .item select:invalid{color:var(--text-3);}
  .progress{font-size:11.5px;color:var(--text-3);text-align:center;margin-bottom:10px;}
  .btn-submit{
    width:100%;padding:15px;border:none;border-radius:var(--radius-sm);
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    margin-top:8px;
  }
  .btn-submit:active{background:var(--accent-dark);}
  .btn-submit:disabled{background:#B9C4B4;cursor:default;}
  .msg{font-size:12.5px;color:var(--text-2);text-align:center;margin-top:10px;}
  .msg.err{color:#B03A2E;}
  .state-center{text-align:center;padding:60px 20px;}
  .state-center h2{font-size:18px;margin-bottom:8px;}
  .state-center p{font-size:14px;color:var(--text-2);line-height:1.5;}
  .checkmark{width:56px;height:56px;margin:0 auto 18px;}
  .hidden{display:none;}
</style>
</head>

function itemTexto(item) { return typeof item === 'string' ? item : item.t; }
function itemEscala(def, item) {
  if (typeof item === 'object' && item.e && def.escalas && def.escalas[item.e]) return def.escalas[item.e];
  return def.escala;
}
function itemInvertido(def, item) {
  if (typeof item === 'object' && item.inv !== undefined) return item.inv;
  return !!def.invertido;
}
function calcularScoresCuestionario(tipoId, respuestas) {
  const def = QUESTIONNAIRES[tipoId];
  if(!def) return {};
  const scores = {};
  def.subescalas.forEach(sub => {
    let sumaPct = 0, n = 0;
    sub.items.forEach((item, i) => {
      const key = tipoId+'_'+sub.id+'_'+i;
      const val = respuestas[key];
      if(val === undefined || val === null || val === '') return;
      const escala = itemEscala(def, item);
      const maxVal = Math.max(...escala.map(e=>e.v));
      const v = parseFloat(val);
      const pct = itemInvertido(def, item) ? (1 - v / maxVal) : (v / maxVal);
      sumaPct += pct; n++;
    });
    scores[sub.id] = n === 0 ? null : Math.round((sumaPct / n) * 100);
  });
  return scores;
}
</script>

<script>
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const firebaseConfig = {
  apiKey: "AIzaSyC-H1Q7ganQheCNS5E-GfW9D0V04s-mneA",
  databaseURL: "https://consultorio-fc375-default-rtdb.firebaseio.com",
};
firebase.initializeApp(firebaseConfig);
const pendRef = firebase.database().ref('consultorio_pendientes');

const qs = new URLSearchParams(location.search);
const pacienteId = qs.get('p') || '';
const tipoId = qs.get('t') || '';
const nombrePaciente = qs.get('n') || '';
const def = QUESTIONNAIRES[tipoId];

const content = document.getElementById('content');

function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function renderError(msg){
  content.innerHTML = `<div class="state-center">
    <h2>No se pudo abrir el cuestionario</h2>
    <p>${esc(msg)}</p>
  </div>`;
}

function renderForm(){
  let html = `<div class="card">
    <div class="card-title">${esc(def.nombre)}</div>
    <div class="card-sub">${esc(def.nombreCompleto)}${nombrePaciente ? ' · ' + esc(nombrePaciente) : ''}</div>
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="cuFecha" value="${todayISO()}">
    </div>
  </div>
  <div class="card">`;

  def.subescalas.forEach(sub=>{
    html += `<div class="sub-header">${esc(sub.label)}</div>`;
    sub.items.forEach((item,i)=>{
      const key = tipoId+'_'+sub.id+'_'+i;
      const escala = itemEscala(def,item);
      html += `<div class="item">
        <label>${esc(itemTexto(item))}</label>
        <select id="cuq_${key}" required>
          <option value="" disabled selected>Elegí una opción…</option>
          ${escala.map(e=>`<option value="${e.v}">${esc(e.l)}</option>`).join('')}
        </select>
      </div>`;
    });
  });

  html += `</div>
    <button class="btn-submit" id="btnSubmit" onclick="submitForm()">Enviar cuestionario</button>
    <div class="msg" id="formMsg"></div>
  `;
  content.innerHTML = html;
}

function submitForm(){
  const fecha = document.getElementById('cuFecha').value;
  if(!fecha){ alert('Falta la fecha.'); return; }

  const respuestas = {};
  let faltantes = 0;
  def.subescalas.forEach(sub=>{
    sub.items.forEach((_,i)=>{
      const key = tipoId+'_'+sub.id+'_'+i;
      const sel = document.getElementById('cuq_'+key);
      if(sel.value !== '') respuestas[key] = sel.value;
      else faltantes++;
    });
  });

  if(faltantes > 0){
    const msg = document.getElementById('formMsg');
    msg.textContent = `Te faltan ${faltantes} pregunta${faltantes!==1?'s':''} por responder.`;
    msg.classList.add('err');
    const firstEmpty = document.querySelector('select:invalid, select option[value=""]:checked');
    if(firstEmpty) firstEmpty.closest('.item')?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const scores = calcularScoresCuestionario(tipoId, respuestas);
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Enviando…';

  pendRef.push({
    pacienteId, tipoId, fecha, respuestas, scores,
    pacienteNombre: nombrePaciente || null,
    ts: Date.now(),
  }).then(()=>{
    content.innerHTML = `<div class="state-center">
      <svg class="checkmark" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26" stroke="#6B8E5C" stroke-width="3"/><path d="M17 29l7 7 15-15" stroke="#6B8E5C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>¡Listo, gracias!</h2>
      <p>Tu cuestionario se envió correctamente. Ya podés cerrar esta página.</p>
    </div>`;
  }).catch(err=>{
    console.error(err);
    btn.disabled = false; btn.textContent = 'Enviar cuestionario';
    const msg = document.getElementById('formMsg');
    msg.textContent = 'Hubo un error al enviar. Intentá de nuevo o avisale a tu kinesiólogo/a.';
    msg.classList.add('err');
  });
}

// ── Init ──
if(!pacienteId || !tipoId){
  renderError('Este link parece incompleto. Pedí que te reenvíen el link desde la app.');
} else if(!def){
  renderError('El tipo de cuestionario no se reconoce. Pedí que te reenvíen el link.');
} else {
  renderForm();
}
</script>
